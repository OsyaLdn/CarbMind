<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/CarbMind/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarbMind - Калькулятор вуглеводів</title>
    <meta name="description" content="Калькулятор вуглеводів у вареній страві" />
    <meta name="theme-color" content="#0d6efd" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/CarbMind/manifest.json" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CarbMind" />
    <link rel="apple-touch-icon" href="/CarbMind/icon-192.png" />
    <script type="module" crossorigin src="/CarbMind/assets/index-2qwfTILI.js"></script>
    <link rel="stylesheet" crossorigin href="/CarbMind/assets/index-Dj3MUMdI.css">
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/CarbMind/sw.js')
            .then(registration => {
              console.log('✅ Service Worker registered:', registration.scope);
            })
            .catch(error => {
              console.log('❌ Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
